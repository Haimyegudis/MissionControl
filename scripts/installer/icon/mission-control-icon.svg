<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c3f"/>
      <stop offset="1" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1fe0e0" stop-opacity="0"/>
      <stop offset="1" stop-color="#1fe0e0" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- rounded-square tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#1fe0e0" stroke-opacity="0.25" stroke-width="6"/>

  <!-- radar rings -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#7e9ad2" stroke-opacity="0.30" stroke-width="6"/>
  <circle cx="256" cy="256" r="108" fill="none" stroke="#7e9ad2" stroke-opacity="0.22" stroke-width="5"/>

  <!-- radar sweep wedge -->
  <path d="M256 256 L256 88 A168 168 0 0 1 401 172 Z" fill="url(#sweep)" opacity="0.55"/>
  <line x1="256" y1="256" x2="256" y2="88" stroke="#1fe0e0" stroke-width="10" stroke-linecap="round"/>

  <!-- orbit blips: Jira / TestRail / Confluence / AI -->
  <circle cx="256" cy="118" r="17" fill="#4f9cf9"/>
  <circle cx="392" cy="238" r="17" fill="#22d38f"/>
  <circle cx="304" cy="382" r="17" fill="#ffd23a"/>
  <circle cx="130" cy="300" r="17" fill="#ff4ecd"/>

  <!-- MC monogram -->
  <text x="256" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="150" font-weight="800"
        text-anchor="middle" fill="#e8eefa" letter-spacing="-6">MC</text>
</svg>
