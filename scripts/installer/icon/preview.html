<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mission Control — Icon Preview</title>
<style>
  body { margin:0; font-family:'Segoe UI',sans-serif; background:#0b1430; color:#e8eefa; display:flex; flex-direction:column; align-items:center; gap:28px; padding:40px; }
  h1 { font-size:20px; letter-spacing:.08em; } h1 b { color:#1fe0e0; }
  .row { display:flex; gap:40px; align-items:flex-end; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:8px; font-size:11px; color:#8aa0bf; }
  .light { background:#eef3fc; border-radius:14px; padding:28px 40px; display:flex; gap:40px; align-items:flex-end; }
  .light .cell { color:#5a6c88; }
  .taskbar { background:#1b2436; border-radius:10px; padding:10px 18px; display:flex; gap:14px; align-items:center; }
  img { image-rendering:auto; display:block; }
</style>
</head>
<body>
  <h1><b>MISSION</b> CONTROL — App Icon</h1>
  <div class="row">
    <div class="cell"><img src="mission-control-icon.svg" width="256" height="256">256</div>
    <div class="cell"><img src="mission-control-icon.svg" width="128" height="128">128</div>
    <div class="cell"><img src="mission-control-icon.svg" width="64" height="64">64</div>
    <div class="cell"><img src="mission-control-icon.svg" width="48" height="48">48</div>
    <div class="cell"><img src="mission-control-icon.svg" width="32" height="32">32</div>
    <div class="cell"><img src="mission-control-icon.svg" width="16" height="16">16</div>
  </div>
  <div class="light">
    <div class="cell"><img src="mission-control-icon.svg" width="96" height="96">על רקע בהיר</div>
    <div class="cell"><img src="mission-control-icon.svg" width="48" height="48">48</div>
  </div>
  <div class="taskbar">
    <img src="mission-control-icon.svg" width="24" height="24">
    <span style="font-size:12px">שורת משימות</span>
    <img src="mission-control-icon.svg" width="16" height="16">
    <span style="font-size:12px">טאב</span>
  </div>
</body>
</html>
